<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>लक्ष्मण सोनबा पाटील परिवार — दाजी पाटील शाखा</title>

<style>
:root{
  --bg:#f3eee5;
  --ink:#2b241d;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  font-family:"Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,sans-serif;
  overflow:auto;
}
.diagram-only{
  width:100%;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle at 50% 42%,#fffdf9 0,#f7f1e8 52%,#eadfce 100%);
  padding:12px;
}
#svg{
  width:min(100%,1200px);
  height:auto;
  aspect-ratio:1;
  display:block;
  cursor:grab;
  touch-action:none;
  user-select:none;
}
#svg.dragging{cursor:grabbing}
.arc{
  cursor:pointer;
  transition:opacity .15s ease,filter .15s ease,stroke-width .15s ease;
}
.arc:hover{filter:brightness(1.06) saturate(1.08)}
.arc.dim{opacity:.075}
.arc.medium{stroke-dasharray:4 3}
.arc.tentative{
  stroke:#9a621b!important;
  stroke-width:2!important;
  stroke-dasharray:8 5;
  opacity:.9
}
.label{
  pointer-events:none;
  fill:#251f19;
  font-weight:700;
  paint-order:stroke;
  stroke:rgba(255,255,255,.86);
  stroke-width:2px;
  stroke-linejoin:round
}
.label.tentative{fill:#6d4615}
.guide{fill:none;stroke:rgba(80,63,47,.14);stroke-width:1.1}
.root{fill:#fffdf8;stroke:#685442;stroke-width:2.2}
.root-label{font-weight:800;text-anchor:middle;dominant-baseline:middle}
#tooltip{
  display:none;
  position:fixed;
  z-index:50;
  pointer-events:none;
  max-width:330px;
  background:rgba(43,34,27,.96);
  color:#fff;
  border-radius:12px;
  padding:10px 12px;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
  font-size:13px;
  line-height:1.45
}
.tt-title{font-weight:800;font-size:15px}
.tt-sub{color:#ddd0c2;margin-top:3px}

/* Animated entrance */
@keyframes ringReveal{
  0%{opacity:0;filter:blur(2px)}
  55%{opacity:.72}
  100%{opacity:1;filter:blur(0)}
}
@keyframes centerReveal{
  0%{opacity:0;transform:scale(.84)}
  100%{opacity:1;transform:scale(1)}
}
.arc.entering,.label.entering{
  opacity:0;
  animation:ringReveal .46s cubic-bezier(.2,.75,.2,1) forwards;
  animation-delay:var(--reveal-delay,0ms)
}
#center.entrance{
  transform-box:view-box;
  transform-origin:0 0;
  animation:centerReveal .48s cubic-bezier(.18,.8,.25,1) both
}

/* Golden ancestry path */
.arc.ancestor{
  opacity:1!important;
  stroke:#e2aa32!important;
  stroke-width:3.8!important;
  filter:
    drop-shadow(0 0 4px rgba(236,185,63,.95))
    drop-shadow(0 0 10px rgba(225,153,31,.58))
}
.label.ancestor{
  opacity:1!important;
  fill:#3b2705;
  stroke:rgba(255,248,214,.98);
  stroke-width:3px;
  filter:drop-shadow(0 0 5px rgba(238,184,52,.72))
}
.arc.active{
  opacity:1!important;
  stroke:#ffd36a!important;
  stroke-width:4.5!important;
  filter:
    drop-shadow(0 0 6px rgba(255,210,99,.98))
    drop-shadow(0 0 14px rgba(222,146,20,.75))
}
.label.active{
  opacity:1!important;
  fill:#221500;
  stroke:#fff2ba;
  stroke-width:3.4px;
  filter:drop-shadow(0 0 7px rgba(240,177,39,.88))
}
#center.path-glow .root{
  stroke:#e2aa32;
  stroke-width:4;
  filter:
    drop-shadow(0 0 5px rgba(236,185,63,.9))
    drop-shadow(0 0 13px rgba(225,153,31,.52))
}
#center.path-glow .root-label{
  fill:#362303;
  filter:drop-shadow(0 0 5px rgba(239,187,63,.65))
}

/* Branch spotlight */
.arc.spotlight{
  opacity:1!important;
  filter:brightness(1.06) saturate(1.12) drop-shadow(0 0 5px rgba(83,58,32,.22))
}
.label.spotlight{opacity:1!important}
#viewport{transform-box:view-box;transform-origin:0 0}

@media(max-width:640px){
  .diagram-only{padding:4px}
  #svg{width:100%}
}
@media(prefers-reduced-motion:reduce){
  .arc.entering,.label.entering,#center.entrance{animation:none!important;opacity:1!important}
}
@media print{
  body,.diagram-only{background:#fff}
  .diagram-only{padding:0}
}
</style>

</head>
<body>
<main class="diagram-only">
  <svg id="svg" viewBox="-980 -980 1960 1960" aria-label="लक्ष्मण सोनबा पाटील radial family tree">
    <g id="viewport">
      <g id="guides"></g>
      <g id="arcs"></g>
      <g id="labels"></g>
      <g id="center"></g>
    </g>
  </svg>
  <div id="tooltip"></div>
</main>

<script>
(() => {
  const data=JSON.parse(document.getElementById("data").textContent);
  const branch=data.root_context.branch;
  const svg=document.getElementById("svg"),viewport=document.getElementById("viewport");
  const arcsG=document.getElementById("arcs"),labelsG=document.getElementById("labels");
  const guidesG=document.getElementById("guides"),centerG=document.getElementById("center");
  const tooltip=document.getElementById("tooltip");

  const palette=["#c69a7a","#8ea674","#c6a65c","#89a9c1","#b48d9c","#c79b64"];
  const ROOT_R=108,OUTER_R=845;
  let zoom=1,panX=0,panY=0,rotation=0,dragging=false,dragStart=null,seq=0;

  function enrich(node,parent=null,depth=0,branchIndex=0){
    node._id="n"+(++seq);node._parent=parent;node._depth=depth;
    node._branchIndex=depth===2?Math.max(0,(node.order||1)-1):branchIndex;
    (node.children||[]).forEach(c=>enrich(c,node,depth+1,node._branchIndex));
  }
  enrich(branch);

  function label(n){
    if(n.name_mr)return n.name_mr;
    if(n.generation===3)return[n.wife_mr,n.husband_mr].filter(Boolean).join(" / ");
    return(n.lines_mr||["—"]).join(" / ");
  }
  function lines(n){
    if(n.name_mr)return[n.name_mr];
    if(n.generation===3)return[n.wife_mr,n.husband_mr].filter(Boolean);
    return n.lines_mr||["—"];
  }

  // Use terminal-leaf weight, but give every terminal node at least one unit.
  function weight(n){
    const kids=n.children||[];
    if(!kids.length)return n._weight=1;
    return n._weight=kids.reduce((s,c)=>s+weight(c),0);
  }
  weight(branch);
  // For sibling groups whose age order was confirmed, make order 1 physically
  // appear to the LEFT of later siblings. In a radial chart the clockwise
  // direction alone does not consistently correspond to screen-left.
  function ageSortedKids(n){
    return [...(n.children||[])].sort((a,b)=>(a.order||999)-(b.order||999));
  }
  function angularCenters(kids,a0,a1){
    const total=kids.reduce((s,c)=>s+c._weight,0);
    let cur=a0;
    return kids.map((c,i)=>{
      const end=i===kids.length-1?a1:cur+(a1-a0)*(c._weight/total);
      const center=(cur+end)/2;
      cur=end;
      return {child:c,center};
    });
  }
  function visualKids(n,a0,a1){
    const kids=ageSortedKids(n);
    if(kids.length<2 || !n.age_order_confirmed)return kids;
    const normal=angularCenters(kids,a0,a1);
    // SVG uses x = r*cos(angle). Smaller x is visually farther left.
    const olderX=Math.cos(normal[0].center);
    const youngerX=Math.cos(normal[normal.length-1].center);
    return olderX<=youngerX ? kids : [...kids].reverse();
  }
  function layout(n,a0,a1){
    n._a0=a0;n._a1=a1;
    const kids=visualKids(n,a0,a1);if(!kids.length)return;

    // Give the two main Daji branches deliberate space instead of pure leaf-count
    // weighting. Vedu stays on the right (~55%) and Kadji gets a broad left sector
    // (~45%) so the Kadji-family names remain legible.
    if(n.name_mr==="दाजी पाटील" && kids.length===2){
      const vedu=kids.find(c=>c.husband_mr==="वेडू") || kids[0];
      const kadji=kids.find(c=>c.husband_mr==="कडजी") || kids[1];
      const split=a0+(a1-a0)*0.55;
      layout(vedu,a0,split);
      layout(kadji,split,a1);
      return;
    }

    const total=kids.reduce((s,c)=>s+c._weight,0);let cur=a0;
    kids.forEach((c,i)=>{
      const end=i===kids.length-1?a1:cur+(a1-a0)*(c._weight/total);
      layout(c,cur,end);cur=end;
    });
  }
  // Rotated slightly so the Kadji sector is centered visually on the left.
  layout(branch,-Math.PI*0.30,Math.PI*1.70);

  const nodes=[];(function collect(n){nodes.push(n);(n.children||[]).forEach(collect)})(branch);
  const maxDepth=Math.max(...nodes.map(n=>n._depth));
  const ringW=(OUTER_R-ROOT_R)/Math.max(1,maxDepth);

  function polar(r,a){return[r*Math.cos(a),r*Math.sin(a)]}
  function arcPath(r0,r1,a0,a1){
    const e=.0015;a0+=e;a1-=e;
    const p0=polar(r1,a0),p1=polar(r1,a1),p2=polar(r0,a1),p3=polar(r0,a0);
    const large=(a1-a0)>Math.PI?1:0;
    return`M ${p0[0]} ${p0[1]} A ${r1} ${r1} 0 ${large} 1 ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]} A ${r0} ${r0} 0 ${large} 0 ${p3[0]} ${p3[1]} Z`;
  }
  function mix(hex,amt){
    const h=hex.slice(1),rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
    const m=v=>Math.round(v+(255-v)*amt);
    return`rgb(${m(rgb[0])},${m(rgb[1])},${m(rgb[2])})`;
  }
  function fill(n){
    const base=palette[n._branchIndex%palette.length];
    return mix(base,Math.min(.63,Math.max(0,(n._depth-1)*.13)));
  }
  function esc(s){
    return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
  }

  for(let d=1;d<=maxDepth;d++){
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("r",ROOT_R+d*ringW);c.setAttribute("class","guide");guidesG.appendChild(c);
  }

  const rc=document.createElementNS("http://www.w3.org/2000/svg","circle");
  rc.setAttribute("r",ROOT_R-5);rc.setAttribute("class","root");centerG.appendChild(rc);
  const rt=document.createElementNS("http://www.w3.org/2000/svg","text");
  rt.setAttribute("class","root-label");rt.setAttribute("font-size","21");
  const rootWords=(branch.name_mr||"").split(/\s+/).filter(Boolean);
  rootWords.forEach((x,i)=>{
    const sp=document.createElementNS("http://www.w3.org/2000/svg","tspan");
    sp.setAttribute("x","0");
    sp.setAttribute("dy",i===0?`${-0.52*(rootWords.length-1)}em`:"1.05em");
    sp.textContent=x;rt.appendChild(sp);
  });
  centerG.appendChild(rt);

  function addLabel(n,r0,r1){
    const mid=(n._a0+n._a1)/2,span=n._a1-n._a0,r=(r0+r1)/2;
    const isKadjiBranch=n._branchIndex===1;
    // Kadji-family labels get priority: allow them to render in narrower wedges.
    const hideThreshold=isKadjiBranch?30:48;
    if(span*r<hideThreshold)return;
    const [x,y]=polar(r,mid);let rot=mid*180/Math.PI+90;if(rot>90&&rot<270)rot+=180;
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("class","label"+(n.relationship_status==="tentative"?" tentative":""));
    t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("text-anchor","middle");
    t.setAttribute("dominant-baseline","central");t.setAttribute("transform",`rotate(${rot} ${x} ${y})`);
    let fs=n._depth===1?23:n._depth===2?18:n._depth===3?15:n._depth===4?13:11;
    if(isKadjiBranch && n._depth>=3)fs+=1.5;
    if(span*r<(isKadjiBranch?66:80))fs-=1;
    t.setAttribute("font-size",Math.max(isKadjiBranch?9.5:9,fs));
    const ls=lines(n);
    // Couple cells should always display both names. For narrow wedges, reduce the font
    // rather than hiding the second person.
    const isCouple = ls.length > 1;
    const max = isCouple ? Math.min(2, ls.length) : 1;
    if (isCouple && span*r < (isKadjiBranch?88:105)) {
      fs = Math.max(isKadjiBranch?9:8, fs - (isKadjiBranch?1:2));
      t.setAttribute("font-size", fs);
    }
    ls.slice(0,max).forEach((s,i)=>{
      const sp=document.createElementNS("http://www.w3.org/2000/svg","tspan");
      sp.setAttribute("x",x);sp.setAttribute("dy",i===0&&max>1?"-.48em":i===0?"0":"1.08em");
      sp.textContent=s;t.appendChild(sp);
    });
    t.dataset.id=n._id;
    t.dataset.depth=n._depth;
    t.style.setProperty("--reveal-delay",`${Math.min(2200,n._depth*260)}ms`);
    t.classList.add("entering");
    labelsG.appendChild(t);
  }


  function render(n){
    if(n._depth===0)return;
    const r0=ROOT_R+(n._depth-1)*ringW,r1=ROOT_R+n._depth*ringW;
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("d",arcPath(r0,r1,n._a0,n._a1));p.setAttribute("fill",fill(n));
    p.setAttribute("stroke","#79634f");p.setAttribute("stroke-width",n._depth===1?"2.3":"1.15");
    let cls="arc";
    if(n.confidence==="medium")cls+=" medium";
    if(n.relationship_status==="tentative")cls+=" tentative";
    p.setAttribute("class",cls);p.dataset.id=n._id;p.dataset.depth=n._depth;
    p.style.setProperty("--reveal-delay",`${Math.min(2200,n._depth*260)}ms`);
    p.classList.add("entering");
    arcsG.appendChild(p);
    p.addEventListener("mouseenter",e=>showTip(e,n));
    p.addEventListener("mousemove",moveTip);p.addEventListener("mouseleave",()=>tooltip.style.display="none");
    p.addEventListener("click",e=>{
      e.stopPropagation();
      if(n.generation===3 && (n.husband_mr==="कडजी" || n.husband_mr==="वेडू")) spotlightBranch(n);
      else select(n);
    });
    addLabel(n,r0,r1);
  }
  nodes.forEach(render);

  function showTip(e,n){
    const tentative=n.relationship_status==="tentative"?" · tentative parent link":"";
    tooltip.innerHTML=`<div class="tt-title">${lines(n).map(esc).join("<br>")}</div><div class="tt-sub">पिढी ${n.generation}${tentative}</div>`;
    tooltip.style.display="block";moveTip(e);
  }
  function moveTip(e){
    tooltip.style.left=Math.min(innerWidth-340,e.clientX+14)+"px";
    tooltip.style.top=Math.min(innerHeight-125,e.clientY+14)+"px";
  }

  function clearVisualClasses(){
    document.querySelectorAll(".arc,.label").forEach(el=>{
      el.classList.remove("dim","active","ancestor","spotlight");
    });
    centerG.classList.remove("path-glow");
  }

  function select(n){
    finishEntrance();
    clearVisualClasses();
    const ancestors=new Set();
    let x=n;
    while(x){ancestors.add(x._id);x=x._parent}

    document.querySelectorAll(".arc,.label").forEach(el=>{
      const isPath=ancestors.has(el.dataset.id);
      el.classList.toggle("dim",!isPath);
      el.classList.toggle("ancestor",isPath);
      el.classList.toggle("active",el.dataset.id===n._id);
    });
    centerG.classList.add("path-glow");

  }

  function descendantsSet(n){
    const ids=new Set();
    (function down(x){ids.add(x._id);(x.children||[]).forEach(down)})(n);
    return ids;
  }

  function finishEntrance(){
    document.querySelectorAll(".arc.entering,.label.entering").forEach(el=>el.classList.remove("entering"));
    centerG.classList.remove("entrance");
  }

  function spotlightBranch(n){
    finishEntrance();
    clearVisualClasses();

    const ids=descendantsSet(n);
    document.querySelectorAll(".arc,.label").forEach(el=>{
      const inside=ids.has(el.dataset.id);
      el.classList.toggle("dim",!inside);
      el.classList.toggle("spotlight",inside);
      el.classList.toggle("active",el.dataset.id===n._id);
    });

    // Rotate the branch midpoint to the top, then translate the middle of that
    // branch's radial mass to the viewport center.
    const mid=(n._a0+n._a1)/2;
    const targetAngle=-Math.PI/2;
    const targetRotation=(targetAngle-mid)*180/Math.PI;
    const targetZoom=n.husband_mr==="कडजी"?1.46:1.34;

    const focusR=ROOT_R+(OUTER_R-ROOT_R)*.47;
    const px=focusR*Math.cos(mid), py=focusR*Math.sin(mid);
    const rr=targetRotation*Math.PI/180;
    const rx=px*Math.cos(rr)-py*Math.sin(rr);
    const ry=px*Math.sin(rr)+py*Math.cos(rr);
    const targetPanX=-targetZoom*rx;
    const targetPanY=-targetZoom*ry;

    animateView(targetZoom,targetPanX,targetPanY,targetRotation);

  }

  function clear(){
    clearVisualClasses();
  }






  let viewAnimFrame=0;

  function matrixFor(z,x,y,rDeg){
    const r=rDeg*Math.PI/180;
    const c=Math.cos(r),s=Math.sin(r);
    return `matrix(${z*c} ${z*s} ${-z*s} ${z*c} ${x} ${y})`;
  }

  function apply(){
    viewport.setAttribute("transform",matrixFor(zoom,panX,panY,rotation));
  }

  function stopViewAnimation(){
    if(viewAnimFrame){ cancelAnimationFrame(viewAnimFrame); viewAnimFrame=0; }
  }

  function animateView(z,x,y,r){
    stopViewAnimation();
    const from={z:zoom,x:panX,y:panY,r:rotation};
    const to={
      z:Math.max(.55,Math.min(3.5,z)),
      x,y,r
    };
    const started=performance.now(),duration=760;
    const ease=t=>1-Math.pow(1-t,3);

    function frame(now){
      const raw=Math.min(1,(now-started)/duration),k=ease(raw);
      zoom=from.z+(to.z-from.z)*k;
      panX=from.x+(to.x-from.x)*k;
      panY=from.y+(to.y-from.y)*k;
      rotation=from.r+(to.r-from.r)*k;
      apply();
      if(raw<1) viewAnimFrame=requestAnimationFrame(frame);
      else viewAnimFrame=0;
    }
    viewAnimFrame=requestAnimationFrame(frame);
  }

  function setZoom(z){
    stopViewAnimation();
    zoom=Math.max(.55,Math.min(3.5,z));apply();
  }
  svg.addEventListener("wheel",e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:.9))},{passive:false});
  svg.addEventListener("pointerdown",e=>{
    // Clicking a family wedge is an action, not the start of a drag.
    if(e.button!==0 || e.target.closest?.(".arc")) return;
    stopViewAnimation();
    dragging=true;
    svg.classList.add("dragging");
    dragStart={x:e.clientX,y:e.clientY,panX,panY};
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove",e=>{
    if(!dragging)return;const scale=1960/svg.getBoundingClientRect().width;
    panX=dragStart.panX+(e.clientX-dragStart.x)*scale/zoom;
    panY=dragStart.panY+(e.clientY-dragStart.y)*scale/zoom;apply();
  });
  svg.addEventListener("pointerup",e=>{dragging=false;svg.classList.remove("dragging");try{svg.releasePointerCapture(e.pointerId)}catch(_){}});
  svg.addEventListener("click",e=>{
    if(e.target.closest?.(".arc")) return;
    clear();
  });
  svg.addEventListener("dblclick",e=>{
    if(e.target.closest?.(".arc")) return;
    finishEntrance();
    clear();
    animateView(1,0,0,0);
  });

  centerG.classList.add("entrance");
  window.setTimeout(finishEntrance,2900);

})();
</script>
</body>
</html>
