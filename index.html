<script>
(() => {
  const branch=JSON.parse(document.getElementById("tree-data").textContent);
  const arcsG=document.getElementById("arcs");
  const labelsG=document.getElementById("labels");
  const guidesG=document.getElementById("guides");
  const centerG=document.getElementById("center");
  const palette=["#c69a7a","#8ea674","#c6a65c","#89a9c1","#b48d9c","#c79b64"];
  const ROOT_R=108,OUTER_R=845;

  function enrich(node,parent=null,depth=0,branchIndex=0){
    node._parent=parent;
    node._depth=depth;
    node._branchIndex=depth===2?Math.max(0,(node.order||1)-1):branchIndex;
    (node.children||[]).forEach(c=>enrich(c,node,depth+1,node._branchIndex));
  }
  enrich(branch);

  function lines(n){
    if(n.name_mr)return[n.name_mr];
    if(n.generation===3)return[n.wife_mr,n.husband_mr].filter(Boolean);
    return n.lines_mr||["—"];
  }

  function weight(n){
    const kids=n.children||[];
    if(!kids.length)return n._weight=1;
    return n._weight=kids.reduce((sum,c)=>sum+weight(c),0);
  }
  weight(branch);

  function ageSortedKids(n){
    return [...(n.children||[])].sort((a,b)=>(a.order||999)-(b.order||999));
  }

  function centers(kids,a0,a1){
    const total=kids.reduce((sum,c)=>sum+c._weight,0);
    let cur=a0;
    return kids.map((c,i)=>{
      const end=i===kids.length-1?a1:cur+(a1-a0)*(c._weight/total);
      const center=(cur+end)/2;
      cur=end;
      return center;
    });
  }

  function visualKids(n,a0,a1){
    const kids=ageSortedKids(n);
    if(kids.length<2||!n.age_order_confirmed)return kids;
    const c=centers(kids,a0,a1);
    return Math.cos(c[0])<=Math.cos(c[c.length-1])?kids:[...kids].reverse();
  }

  function layout(n,a0,a1){
    n._a0=a0;n._a1=a1;
    const kids=visualKids(n,a0,a1);
    if(!kids.length)return;

    if(n.name_mr==="दाजी पाटील"&&kids.length===2){
      const vedu=kids.find(c=>c.husband_mr==="वेडू")||kids[0];
      const kadji=kids.find(c=>c.husband_mr==="कडजी")||kids[1];
      const split=a0+(a1-a0)*0.55;
      layout(vedu,a0,split);
      layout(kadji,split,a1);
      return;
    }

    const total=kids.reduce((sum,c)=>sum+c._weight,0);
    let cur=a0;
    kids.forEach((c,i)=>{
      const end=i===kids.length-1?a1:cur+(a1-a0)*(c._weight/total);
      layout(c,cur,end);
      cur=end;
    });
  }
  layout(branch,-Math.PI*.30,Math.PI*1.70);

  const nodes=[];
  (function collect(n){nodes.push(n);(n.children||[]).forEach(collect)})(branch);
  const maxDepth=Math.max(...nodes.map(n=>n._depth));
  const ringW=(OUTER_R-ROOT_R)/Math.max(1,maxDepth);

  function polar(r,a){return[r*Math.cos(a),r*Math.sin(a)]}

  function arcPath(r0,r1,a0,a1){
    const e=.0015;a0+=e;a1-=e;
    const p0=polar(r1,a0),p1=polar(r1,a1),p2=polar(r0,a1),p3=polar(r0,a0);
    const large=(a1-a0)>Math.PI?1:0;
    return`M ${p0[0]} ${p0[1]} A ${r1} ${r1} 0 ${large} 1 ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]} A ${r0} ${r0} 0 ${large} 0 ${p3[0]} ${p3[1]} Z`;
  }

  function mix(hex,amt){
    const h=hex.slice(1);
    const rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
    const m=v=>Math.round(v+(255-v)*amt);
    return`rgb(${m(rgb[0])},${m(rgb[1])},${m(rgb[2])})`;
  }

  function fill(n){
    const base=palette[n._branchIndex%palette.length];
    return mix(base,Math.min(.63,Math.max(0,(n._depth-1)*.13)));
  }

  for(let d=1;d<=maxDepth;d++){
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("r",ROOT_R+d*ringW);
    c.setAttribute("class","guide");
    guidesG.appendChild(c);
  }

  const rootCircle=document.createElementNS("http://www.w3.org/2000/svg","circle");
  rootCircle.setAttribute("r",ROOT_R-5);
  rootCircle.setAttribute("class","root");
  centerG.appendChild(rootCircle);

  const rootText=document.createElementNS("http://www.w3.org/2000/svg","text");
  rootText.setAttribute("class","root-label");
  rootText.setAttribute("font-size","21");
  const words=(branch.name_mr||"").split(/\s+/).filter(Boolean);
  words.forEach((word,i)=>{
    const t=document.createElementNS("http://www.w3.org/2000/svg","tspan");
    t.setAttribute("x","0");
    t.setAttribute("dy",i===0?`${-0.52*(words.length-1)}em`:"1.05em");
    t.textContent=word;
    rootText.appendChild(t);
  });
  centerG.appendChild(rootText);

  function addLabel(n,r0,r1){
    const mid=(n._a0+n._a1)/2;
    const span=n._a1-n._a0;
    const r=(r0+r1)/2;
    const kadji=n._branchIndex===1;
    if(span*r<(kadji?30:48))return;

    const [x,y]=polar(r,mid);
    let rot=mid*180/Math.PI+90;
    if(rot>90&&rot<270)rot+=180;

    const text=document.createElementNS("http://www.w3.org/2000/svg","text");
    text.setAttribute("class","label"+(n.relationship_status==="tentative"?" tentative":""));
    text.setAttribute("x",x);
    text.setAttribute("y",y);
    text.setAttribute("text-anchor","middle");
    text.setAttribute("dominant-baseline","central");
    text.setAttribute("transform",`rotate(${rot} ${x} ${y})`);

    let fs=n._depth===1?23:n._depth===2?18:n._depth===3?15:n._depth===4?13:11;
    if(kadji&&n._depth>=3)fs+=1.5;
    if(span*r<(kadji?66:80))fs-=1;

    const ls=lines(n);
    const couple=ls.length>1;
    const max=couple?Math.min(2,ls.length):1;
    if(couple&&span*r<(kadji?88:105))fs=Math.max(kadji?9:8,fs-(kadji?1:2));
    text.setAttribute("font-size",Math.max(kadji?9.5:9,fs));

    ls.slice(0,max).forEach((name,i)=>{
      const t=document.createElementNS("http://www.w3.org/2000/svg","tspan");
      t.setAttribute("x",x);
      t.setAttribute("dy",i===0&&max>1?"-.48em":i===0?"0":"1.08em");
      t.textContent=name;
      text.appendChild(t);
    });
    labelsG.appendChild(text);
  }

  nodes.forEach(n=>{
    if(n._depth===0)return;
    const r0=ROOT_R+(n._depth-1)*ringW;
    const r1=ROOT_R+n._depth*ringW;
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",arcPath(r0,r1,n._a0,n._a1));
    path.setAttribute("fill",fill(n));
    path.setAttribute("stroke","#79634f");
    path.setAttribute("stroke-width",n._depth===1?"2.3":"1.15");

    let cls="arc";
    if(n.confidence==="medium")cls+=" medium";
    if(n.relationship_status==="tentative")cls+=" tentative";
    path.setAttribute("class",cls);

    arcsG.appendChild(path);
    addLabel(n,r0,r1);
  });
})();
</script>
